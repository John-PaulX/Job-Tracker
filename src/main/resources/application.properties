##  Hibernate / JPA Settings
## This tells Hibernate to auto-create/update tables based on your Java classes
## 'update' means: create table if not exists, update columns if you add new fields
#spring.jpa.hibernate.ddl-auto=update
#
## This tells Hibernate which SQL dialect to use for MySQL 8
#spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
#
## This prints every SQL query Hibernate runs in the console - very helpful for debugging
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#
##  Server
## Your app runs on port 8080 by default
#server.port=8080
#
## Allow Frontend to talk to Backend (CORS)
#spring.web.resources.static-locations=classpath:/static/

# App name
spring.application.name=job-tracker

# Railway MySQL environment variables
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Railway assigns port automatically
server.port=${PORT:8080}

# Static files
spring.web.resources.static-locations=classpath:/static/